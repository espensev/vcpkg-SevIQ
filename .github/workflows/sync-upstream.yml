name: Sync upstream vcpkg

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/microsoft/vcpkg.git || true
          git fetch upstream master

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream is $BEHIND commits ahead"

      - name: Merge upstream while preserving fork workflows
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge upstream/master --no-commit --no-ff; then
            # GITHUB_TOKEN cannot update workflow files. Keep the fork-owned
            # workflow tree while syncing every other upstream path.
            git restore --source=HEAD --staged --worktree -- .github/workflows
            git commit --no-edit
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify fork workflows are unchanged
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.conflict == 'false'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows; then
            echo "Upstream merge changed fork-owned workflow files; refusing to push."
            git diff --stat HEAD^1 HEAD -- .github/workflows
            exit 1
          fi

      - name: Push merged changes
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.conflict == 'false'
        run: git push origin master

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          TITLE="sync: upstream vcpkg merge needs manual resolution"
          BODY="Automated upstream sync found merge conflicts on $(date -u +%Y-%m-%d). The merge was aborted without committing conflict markers. Run the sync locally, resolve the conflicts, and push master."
          ISSUE_NUMBER="$(gh issue list --state open --search \"$TITLE in:title\" --json number --jq '.[0].number // empty')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
